# Runs LOCALLY only: `pnpm ci:local` (gh act + Docker). See docs/design-docs/0003-hosting.md.
# Do not add push / pull_request / schedule triggers: scripts/check-workflows.mjs rejects them.
# @gyral/* comes from the tarballs in vendor/ (until 0.3.1 is on npm), so only this repo is
# checked out. Without a Gyral checkout the examples drift check (sync:examples --check) skips;
# run it locally next to the Gyral repo.
name: ci

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm check
